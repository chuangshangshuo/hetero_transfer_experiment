inherit: configs/week7_transfer.yaml
workspace_root: <workspace_root>
is_posthoc_after_week10: false
prerun_frozen: true
prerun_frozen_at_local: "2026-05-09 Asia/Shanghai"

inputs:
  week7_config: configs/week7_transfer.yaml
  week7_transfer_summary: output/week7/metrics/transfer_summary.csv
  week7_transfer_method_summary: output/week7/metrics/transfer_method_summary.csv
  week9_fewshot_curve: output/week9/metrics/W9_E1_fewshot_curve.csv
  week9_fewshot_stability: output/week9/metrics/W9_E2_fewshot_seed_stability.csv
  week9_fewshot_rollup: output/week9/metrics/week9_fewshot_rollup.csv
  week9_hard_negative_raw: output/week9/metrics/hard_negative_family_raw.csv
  week9_hard_negative_summary: output/week9/metrics/hard_negative_family_summary.csv
  week85_family_assignments: output/week85/audits/E3_w85_dk_family_assignments.csv
  evidence_boundary_table: docs/evidence_boundary_table.md

output:
  root: output/week11
  runs: output/week11/runs
  metrics: output/week11/metrics
  audits: output/week11/audits
  plots: output/week11/plots
  logs: output/week11/logs
  tables: output/week11/tables

seeds: [42, 43, 44, 45, 46]

P1_family_metric:
  enabled: true
  encoder_seeds: [42, 43, 44, 45, 46]
  eligible_family_min_size: 2
  alpha: 0.5
  binary_weight: 1.0
  temperature: 0.1
  projection_dim: 32
  hidden_dim: 64
  learning_rate: 0.003
  weight_decay: 0.0001
  epochs: 200
  patience: 50
  core_method: A2_main
  ablation_families: [tsars, ggbet]
  ablations:
    - name: A1_only_binary
      alpha: 0.0
      binary_weight: 1.0
      shuffle_family_labels: false
    - name: A2_main
      alpha: 0.5
      binary_weight: 1.0
      shuffle_family_labels: false
    - name: A3_only_supcon
      alpha: 1.0
      binary_weight: 0.0
      shuffle_family_labels: false
    - name: A4_shuffled_family
      alpha: 0.5
      binary_weight: 1.0
      shuffle_family_labels: true
  hypotheses:
    H_P1a:
      metric: core_mean_hard_negative_auc
      threshold: 0.75
      direction: greater_equal
    H_P1b:
      metric: tsars_hard_negative_auc
      threshold: 0.70
      direction: greater_equal
    H_P1c:
      metric: mean_auc_delta_vs_w9
      threshold: 0.10
      direction: greater_equal
    H_P1d:
      metric: A2_minus_A4_gap
      threshold: 0.05
      direction: greater_equal

P2_invariance_methods:
  enabled: true
  transfer_ids: [T1_Nordic, T2_PH, T2_ON, T3_DiagnoseFrance]
  methods:
    - irm
    - eerm
  irm:
    enabled_for: [T2_PH]
    lambda_irm_warmup: cosine
    lambda_irm_max: 1.0
    warmup_epochs: 50
    min_env_samples: 4
    require_two_classes_per_env: true
  eerm:
    enabled_for: [T1_Nordic, T2_PH, T2_ON, T3_DiagnoseFrance]
    K_values: [2, 4]
    embedding_for_clustering: frozen_heco
    min_env_samples: 4
  max_epochs: 200
  min_epochs_before_early_stop: 50
  patience: 25
  learning_rate_encoder: 0.0005
  learning_rate_head: 0.005
  weight_decay: 0.0001
  hypotheses:
    H_P2a:
      metric: max_improvement_vs_source_only
      threshold: 0.05
      direction: greater_equal
    H_P2b:
      metric: all_new_methods_not_significant
      threshold: 1
      direction: any_result_is_informative
    H_P2c:
      metric: max_eerm_k_range
      threshold: 0.10
      direction: less_equal

P3_full_fewshot:
  enabled: true
  transfers: [T1_Nordic, T2_ON]
  shots_per_class: [0, 1, 3, 5, 10]
  target_loss_weight: 1.0
  max_epochs: 200
  min_epochs_before_early_stop: 50
  patience: 25
  one_class_protocols:
    T1_Nordic:
      target_support_label: 1
      target_support_tier_priority: illegal_confirmed_official_single
      target_metric: illegal_recall_at_youden
      recovery_threshold: 0.50
      forbidden_claim: Do not force standard ROC-AUC for this one-class target.
    T2_ON:
      target_support_label: 0
      target_metric: mean_pred_illegal
      recovery_threshold: 0.30
      recovery_direction: lower_is_better
      forbidden_claim: Do not treat licensed-only calibration as evidence of illegal recall.
  hypotheses:
    H_P3a:
      target_id: T1_Nordic
      shot: 5
      metric: illegal_recall_at_youden
      threshold: 0.50
      direction: greater_equal
    H_P3b:
      target_id: T2_ON
      shot: 5
      metric: mean_pred_illegal
      threshold: 0.30
      direction: less_equal
    H_P3c:
      metric: recoverable_transfer_count
      threshold: 3
      direction: greater_equal

P4_significance:
  enabled: true
  bootstrap_B: 10000
  alpha: 0.05
  multiple_comparison: holm_bonferroni
  hypotheses:
    H_P4a:
      metric: w7_significant_pair_count
      threshold: 1
      direction: greater_equal
    H_P4b:
      metric: w9_significant_pair_count
      threshold: 4
      direction: greater_equal

P5_writing:
  enabled: true
  section5_min_chars: 3500
  rq_plus_section5_min_chars: 8000
  evidence_boundary_required_citation: docs/evidence_boundary_table.md
  hypotheses:
    H_P5a:
      metric: section5_chars
      threshold: 3500
      direction: greater_equal
    H_P5b:
      metric: rq_plus_section5_chars
      threshold: 8000
      direction: greater_equal
    H_P5c:
      metric: section5_cites_evidence_boundary_table
      threshold: 1
      direction: greater_equal
