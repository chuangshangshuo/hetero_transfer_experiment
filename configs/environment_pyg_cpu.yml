name: hetero-transfer-v2
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - --find-links https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pyyaml==6.0.3
      - networkx==3.4.2
      - tqdm==4.67.3
      - maxminddb==3.1.1
      - torch==2.5.1+cpu
      - torch-geometric==2.6.1
      - pyg-lib==0.4.0+pt25cpu
      - torch-scatter==2.1.2+pt25cpu
      - torch-sparse==0.6.18+pt25cpu
      - torch-cluster==1.6.3+pt25cpu
      - torch-spline-conv==1.2.2+pt25cpu

# Install notes:
# 1. Create the environment with Python/pip first:
#    conda create -y -n hetero-transfer-v2 python=3.10 pip
# 2. Install torch from the CPU index:
#    conda run -n hetero-transfer-v2 python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
# 3. Install PyG extension wheels:
#    conda run -n hetero-transfer-v2 python -m pip install pyg-lib torch-scatter torch-sparse torch-cluster torch-spline-conv -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
